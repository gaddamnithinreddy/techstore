<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TechStore</title>
    <meta name="description" content="Premium Tech Marketplace" />
    <meta name="author" content="TechStore" />

    <meta property="og:title" content="TechStore" />
    <meta property="og:description" content="Premium Tech Marketplace" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@techstore" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
    
    <style>
      :root {
        --background: #000;
        --foreground: #fff;
      }
      
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        width: 100%;
        overflow-x: hidden;
        background-color: var(--background);
        color: var(--foreground);
      }
      
      body {
        position: relative;
      }
      
      #root {
        min-height: 100vh;
        width: 100%;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
      }

      * {
        box-sizing: border-box;
      }
      
      /* Ensures all content is contained properly */
      .container {
        width: 100%;
        margin-left: auto;
        margin-right: auto;
        padding-left: 1rem;
        padding-right: 1rem;
      }
      
      @media (min-width: 640px) {
        .container {
          max-width: 640px;
          padding-left: 1.5rem;
          padding-right: 1.5rem;
        }
      }
      
      @media (min-width: 768px) {
        .container {
          max-width: 768px;
        }
      }
      
      @media (min-width: 1024px) {
        .container {
          max-width: 1024px;
          padding-left: 2rem;
          padding-right: 2rem;
        }
      }
      
      @media (min-width: 1280px) {
        .container {
          max-width: 1280px;
        }
      }
      
      @media (min-width: 1536px) {
        .container {
          max-width: 1536px;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <!-- IMPORTANT: DO NOT REMOVE THIS SCRIPT TAG OR THIS VERY COMMENT! -->
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
